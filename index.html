<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>12 August 2026 — the eclipse from northern Italy</title>
<meta name="description" id="metadesc" content="Where to stand in northern Italy for the 12 August 2026 eclipse at sunset.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23f5c451'/><circle cx='64' cy='42' r='38' fill='%230b0e17'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#080a11; --bg2:#0d111c; --panel:#121828; --panel2:#171e31;
  --line:#252e45; --line2:#33405e;
  --txt:#e8ecf6; --dim:#98a3bd; --dim2:#6b7691;
  --gold:#f5c451; --gold2:#ffdc8a; --red:#ff6b6b; --grn:#5fd6a0; --blu:#6fb3ff;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);overflow-x:hidden;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--gold)}
h1,h2,h3{line-height:1.2;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@supports(padding:max(0px)){.wrap{padding-left:max(20px,env(safe-area-inset-left));
  padding-right:max(20px,env(safe-area-inset-right))}}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(1200px 520px at 72% -10%,#1d2740 0%,transparent 62%),
             radial-gradient(700px 400px at 12% 0%,#2e1f1a 0%,transparent 60%),var(--bg)}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.hero-in{position:relative;padding-top:26px;padding-bottom:46px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:20px}
.langsw{display:inline-flex;border:1px solid var(--line2);border-radius:99px;
  overflow:hidden;background:#0f1420}
.langsw button{appearance:none;border:0;background:transparent;color:var(--dim);
  font:600 13px/1 var(--mono);letter-spacing:.06em;padding:0 18px;min-height:44px;
  cursor:pointer;transition:.15s}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#12100a}
.langsw button:not([aria-pressed="true"]):hover{color:var(--txt)}
.kicker{font:600 12px/1.35 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--gold);
  display:inline-block;padding:8px 13px;border:1px solid #4a3c1c;
  border-radius:99px;background:#1d1708}
h1{font-size:clamp(30px,6vw,58px);font-weight:800;letter-spacing:-.028em;margin:20px 0 0}
h1 .g{background:linear-gradient(96deg,var(--gold2),var(--gold) 45%,#e0913a);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:clamp(15px,2.1vw,19px);max-width:680px;margin:16px 0 0}
.cd{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.cd div{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;min-width:72px;text-align:center;flex:1 1 auto;max-width:120px}
.cd b{display:block;font:700 clamp(20px,5vw,25px)/1 var(--mono);color:var(--gold)}
.cd span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2)}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.jump a{font-size:13.5px;color:var(--dim);text-decoration:none;padding:11px 15px;
  border:1px solid var(--line);border-radius:99px;background:#0f1420;transition:.15s}
.jump a:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}

section{padding:clamp(30px,6vw,52px) 0}
.panel[hidden]{display:none}

.banner{background:linear-gradient(180deg,#5a1414,#3d0f10);border-top:1px solid #7d2222;
  border-bottom:1px solid #7d2222}
.banner .wrap{padding-top:14px;padding-bottom:14px;display:flex;gap:10px;
  align-items:baseline;flex-wrap:wrap}
.banner strong{color:#ffd9d9;font-size:15.5px;letter-spacing:.01em}
.banner span{color:#f0bcbc;font-size:14.5px}
.banner a{color:#fff;font-weight:600;font-size:14.5px;white-space:nowrap}

.tabbar{position:sticky;top:0;z-index:50;background:rgba(8,10,17,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:9px 0}
.tabrow::-webkit-scrollbar{display:none}
.tabrow button{flex:0 0 auto;font-size:14px;padding:0 16px;min-height:44px;
  display:inline-flex;align-items:center;border-radius:99px;
  border:1px solid transparent;background:transparent;color:var(--dim);white-space:nowrap}
.tabrow button:hover{color:var(--txt);background:var(--panel)}
.tabrow button[aria-selected="true"]{background:var(--gold);color:#12100a;font-weight:650}
.tabrow button.danger[aria-selected="true"]{background:#c0392f;color:#fff}
.tabrow button.danger{color:#ff9c9c}
.tabrow button.danger:hover{background:#2a1416;color:#ffc9c9}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
h2{font-size:clamp(23px,3.6vw,34px);font-weight:750;letter-spacing:-.02em}
.lede{color:var(--dim);max-width:730px;margin:14px 0 0;font-size:16.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(17px,3.5vw,22px)}
.grid{display:grid;gap:16px}
/* grid items default to min-width:auto, so a wide table inside a card blows the
   track out past its container. Pin them to 0 and let .scroll do the scrolling. */
.grid>*,.sgrid>*{min-width:0}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

select,input,button{font:inherit;color:var(--txt);background:var(--panel2);
  border:1px solid var(--line2);border-radius:10px;padding:11px 14px}
button{cursor:pointer;transition:.15s}

table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--txt)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.best td{background:#132218}
tr.bad td{background:#1e1214;color:var(--dim)}
.vlab{font-weight:600;white-space:nowrap}
.vtip{color:var(--dim2);font-size:12px;white-space:nowrap}
@media(max-width:620px){.vtip{display:none}}
.hint{display:none;font:11.5px var(--mono);color:var(--dim2);margin:8px 0 0}
.hint.show{display:block}

.warn{border-left:3px solid var(--red);background:#1e1214;padding:14px 16px;border-radius:0 10px 10px 0;margin-top:16px}
.warn b{color:#ff9c9c}
.note{border-left:3px solid var(--blu);background:#101a28;padding:14px 16px;border-radius:0 10px 10px 0;margin-top:16px;color:var(--dim)}
.ok{border-left:3px solid var(--grn);background:#0f1e18;padding:14px 16px;border-radius:0 10px 10px 0;margin-top:16px;color:var(--dim)}

#map{height:clamp(330px,55vh,500px);border-radius:16px;border:1px solid var(--line);background:#0c1018;z-index:1}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--txt);border-radius:12px}
.leaflet-popup-tip{background:var(--panel2)}
.leaflet-popup-content{margin:13px 15px;font-size:14px}
.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:middle}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:24px 0 8px}
.chip{font-size:13px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;
  border-radius:99px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{color:var(--txt);border-color:#43537a}
.chip.on{background:#2a3b22;border-color:#4a7a30;color:#b9e88a}
#dsearch{min-width:170px;flex:1 1 200px}
.counts{color:var(--dim2);font-size:13.5px;margin:6px 0 0;font-family:var(--mono)}

.citygrp{margin-top:32px}
.cityhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.cityhead h3{font-size:21px;font-weight:700}
.cityhead .reg{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--dim2);
  border:1px solid var(--line2);border-radius:5px;padding:4px 7px}
.cityhead .what{font-size:13.5px;color:var(--dim);font-family:var(--mono)}
.sgrid{display:grid;gap:14px}
@media(min-width:820px){.sgrid{grid-template-columns:1fr 1fr}}
.scard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:17px;
  display:flex;flex-direction:column}
.scard.clear{border-color:#2e6b4e}
.scard.tight{border-color:#7a5a20}
.scard.blocked{border-color:#6b2e2e;opacity:.82}
.vb{font:700 10.5px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  padding:6px 9px;border-radius:5px;display:inline-block;margin-bottom:11px}
.vb.clear{background:#1d5c3f;color:#9ff0c6}
.vb.work{background:#4a5c1d;color:#dcf09f}
.vb.tight{background:#6b4c14;color:#ffd98a}
.vb.unver{background:#3d3a52;color:#c9c2f0}
.vb.blocked{background:#5c1f1f;color:#ffb3b3}
.scard h4{font-size:16.5px;margin:0 0 3px}
.scard .kind{font:12px var(--mono);color:var(--dim2);margin-bottom:12px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin-bottom:13px}
@media(max-width:420px){.ev{grid-template-columns:1fr;gap:1px 0}
  .ev dt{margin-top:7px}}
.ev dt{color:var(--dim2)}
.ev dd{margin:0;font-family:var(--mono);color:var(--dim);overflow-wrap:anywhere}
.ev dd b{color:var(--txt);font-weight:600}
.bar{height:6px;border-radius:3px;background:#1a2233;overflow:hidden;margin:2px 0 12px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.links a{font-size:12.5px;text-decoration:none;padding:0 13px;min-height:44px;
  display:inline-flex;align-items:center;border-radius:8px;
  border:1px solid var(--line2);color:var(--dim);background:var(--bg2);transition:.15s}
.links a:hover{color:var(--gold);border-color:#5a4a22;background:#1a1710}
.est{font-size:11.5px;color:var(--dim2);font-style:italic;margin-top:9px}

.animwrap{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:8px 8px 14px}
.animwrap svg{display:block;width:100%;height:auto;border-radius:10px}
.animbar{display:flex;gap:12px;align-items:center;padding:12px 8px 4px}
.playbtn{min-width:104px;min-height:42px;border-radius:99px;border:1px solid var(--gold);
  background:var(--gold);color:#12100a;font-weight:650;font-size:14px}
.playbtn:hover{filter:brightness(1.08)}
#animrange{flex:1;-webkit-appearance:none;appearance:none;background:transparent;
  padding:0;border:0;min-height:44px;touch-action:pan-y}
#animrange::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#22304c}
#animrange::-moz-range-track{height:6px;border-radius:3px;background:#22304c}
#animrange::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:var(--gold);margin-top:-10px;border:0}
#animrange::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:0}
.animread{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 8px 0}
@media(max-width:560px){.animread{grid-template-columns:repeat(2,1fr)}}
.animread dt{font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.animread dd{margin:5px 0 0;font:600 17px/1.2 var(--mono);color:var(--txt)}

.seetabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
@media(max-width:760px){
  .seetabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:4px}
  .seetabs::-webkit-scrollbar{display:none}
  .seetabs button{flex:0 0 auto}
}
.seetabs button{font-size:13.5px;padding:0 16px;min-height:44px;display:inline-flex;
  align-items:center;border-radius:99px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--dim)}
.seetabs button:hover{color:var(--txt);border-color:#43537a}
.seetabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#12100a;font-weight:600}
.seewrap{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:8px}
.seewrap svg{display:block;width:100%;height:auto}
.seeverdict{font-size:17px;margin:16px 0 0;color:var(--txt)}
.seeground{color:var(--dim);font-size:14.5px;margin:8px 0 0}
.seeother{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--dim2);
  font-size:13.5px;flex-wrap:wrap}
.seeother select{min-height:44px}

.tl{position:relative;padding-left:26px;margin-top:24px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.evt{position:relative;padding:0 0 24px}
.evt:before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--panel);border:2px solid var(--gold)}
.evt.dim:before{border-color:var(--line2)}
.evt time{font:600 13px/1 var(--mono);color:var(--gold)}
.evt.dim time{color:var(--dim2)}
.evt h4{margin:7px 0 4px;font-size:16.5px}
.evt p{margin:0;color:var(--dim);font-size:14.5px}

footer{padding:42px 0 68px;color:var(--dim2);font-size:13.5px}
footer a{color:var(--dim)}
.src{columns:2;column-gap:28px;margin-top:12px;padding-left:18px}
@media(max-width:700px){.src{columns:1}}
.src li{break-inside:avoid;margin-bottom:6px}
</style>
</head>
<body>

<header class="hero">
<canvas id="stars"></canvas>
<div class="wrap hero-in">
  <div class="topbar">
    <div class="langsw" role="group" aria-label="Language / Lingua">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-it" aria-pressed="false">IT</button>
    </div>
  </div>
  <div class="kicker" data-i18n="kicker"></div>
  <h1 data-i18n="h1"></h1>
  <p class="sub" data-i18n="sub"></p>
  <div class="cd">
    <div><b id="cd-d">–</b><span data-i18n="cdD"></span></div>
    <div><b id="cd-h">–</b><span data-i18n="cdH"></span></div>
    <div><b id="cd-m">–</b><span data-i18n="cdM"></span></div>
    <div><b id="cd-s">–</b><span data-i18n="cdS"></span></div>
  </div>
  
</div>
</header>

<div class="banner" role="alert">
  <div class="wrap">
    <strong data-i18n="bannerTitle"></strong>
    <a href="#safety" data-i18n="bannerLink"></a>
  </div>
</div>
<nav class="tabbar" aria-label="Sections"><div class="wrap"><div class="tabrow" id="tabrow"></div></div></nav>
<main id="panels">
<section id="safety" class="panel" hidden>
<div class="wrap">
  <div class="eyebrow" data-i18n="safeEyebrow"></div>
  <h2 data-i18n="safeH2"></h2>
  <div class="grid g2" style="margin-top:22px">
    <div class="card" style="border-color:#6b2e2e;background:linear-gradient(180deg,#241213,#151016)">
      <h3 style="color:#ff9c9c;font-size:19px" data-i18n="safeC1H"></h3>
      <p style="color:var(--dim);margin-top:12px" data-i18n="safeC1P1"></p>
      <p style="color:var(--dim);margin-top:12px" data-i18n="safeC1P2"></p>
      <p style="color:var(--dim);margin-top:12px" data-i18n="safeC1P3"></p>
    </div>
    <div class="card">
      <h3 style="font-size:19px" data-i18n="safeC2H"></h3>
      <ul style="color:var(--dim);margin:12px 0 0;padding-left:20px">
        <li data-i18n="safeL1"></li><li data-i18n="safeL2"></li>
        <li data-i18n="safeL3"></li><li data-i18n="safeL4"></li>
      </ul>
      <div class="warn" style="margin-top:14px" data-i18n="safeWarn"></div>
    </div>
  </div>
</div>
</section>
<section id="night" class="panel" hidden><div class="wrap">
  <div class="eyebrow" data-i18n="seeEyebrow"></div>
  <h2 data-i18n="animH"></h2>
  <p class="lede" data-i18n="animLede"></p>
  <div class="seetabs" id="seetabs"></div>
  <div class="animwrap">
    <div id="animsvg"></div>
    <div class="animbar">
      <button id="animbtn" class="playbtn"></button>
      <input id="animrange" type="range" min="0" max="1000" value="0" step="1">
    </div>
    <dl class="animread">
      <div><dt data-i18n="animTime"></dt><dd id="rdTime">–</dd></div>
      <div><dt data-i18n="animCov"></dt><dd id="rdCov">–</dd></div>
      <div><dt data-i18n="animAlt"></dt><dd id="rdAlt">–</dd></div>
      <div><dt data-i18n="animPhase"></dt><dd id="rdPhase">–</dd></div>
    </dl>
  </div>
  <p style="color:var(--dim2);font-size:13px;margin-top:10px" data-i18n="animFoot"></p>
  <label class="seeother"><span data-i18n="seeOther"></span><select id="seesel"></select></label>
</div>
<div class="wrap">
  <div class="eyebrow" data-i18n="whyEyebrow"></div>
  <h2 data-i18n="whyH2"></h2>
  <p class="lede" data-i18n="whyLede"></p>
  <div class="grid g2" style="margin-top:22px">
    <div class="card">
      <h3 style="font-size:18px" data-i18n="whyC1H"></h3>
      <p style="color:var(--dim);margin-top:10px" data-i18n="whyC1P"></p>
      <div class="scroll"><table style="margin-top:10px;font-size:13.5px">
        <thead><tr>
          <th style="cursor:default" data-i18n="thWhere"></th>
          <th class="num" style="cursor:default" data-i18n="thSun"></th>
          <th class="num" style="cursor:default" data-i18n="thTerr"></th>
          <th class="num" style="cursor:default" data-i18n="thMargin"></th>
          <th style="cursor:default" data-i18n="thVisible"></th>
        </tr></thead>
        <tbody id="whytbl"></tbody>
      </table></div>
      <p style="color:var(--dim2);font-size:13px;margin-top:10px" data-i18n="whyC1Cap"></p>
      <div class="ok" style="margin-top:14px">
        <strong data-i18n="idealH"></strong><br><span data-i18n="idealP"></span>
      </div>
    </div>
    <div class="card" style="border-color:#7a5a20">
      <h3 style="font-size:18px;color:var(--gold)" data-i18n="whyC2H"></h3>
      <p style="color:var(--dim);margin-top:10px" data-i18n="whyC2P"></p>
      <ul style="color:var(--dim);margin:10px 0 0;padding-left:20px">
        <li data-i18n="whyB1"></li><li data-i18n="whyB2"></li><li data-i18n="whyB3"></li>
        <li data-i18n="whyB4"></li><li data-i18n="whyB5"></li>
      </ul>
      <p style="color:var(--dim);margin-top:12px" data-i18n="whyC2P2"></p>
      <div class="ok" style="margin-top:12px" data-i18n="whyOk"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow" data-i18n="seeEyebrow"></div>
  <h2 data-i18n="seeH2"></h2>
  <p class="lede" data-i18n="seeLede"></p>
  
  <div class="seewrap"><div id="seesvg"></div></div>
  <p class="seeverdict" id="seeverdict"></p>
  <p class="seeground" id="seeground"></p>
  <p style="color:var(--dim2);font-size:13px;margin-top:10px" data-i18n="seeCap1"></p>
  
</div>

<div class="wrap">
  <div class="eyebrow" data-i18n="truthEyebrow"></div>
  <h2 data-i18n="truthH2"></h2>
  <div class="grid g2" style="margin-top:22px">
    <div class="card">
      <h3 style="font-size:18px" data-i18n="truthC1H"></h3>
      <p style="color:var(--dim);margin-top:10px" data-i18n="truthC1P1"></p>
      <p style="color:var(--dim);margin-top:10px" data-i18n="truthC1P2"></p>

 disclaimerP:"This page is a calculation, not a promise. The eclipse geometry comes from NASA's published elements, the terrain from SRTM, the open spaces and transit stops from OpenStreetMap. Any of those can be wrong or out of date: a hill can be mismapped, a building can be untagged, a row of trees appears in no dataset at all. Check anything you are travelling for against a second source.",
 disclaimerP2:"Use this at your own risk. I accept no responsibility for a wasted journey, a missed eclipse, damaged equipment, or injury of any kind. Looking at the sun is dangerous and it is your responsibility: use a certified filter, and if you are unsure, do not look.",

 whereEyebrow:"Where to go",
 whereH2:"Places with the horizon measured",
 whereLede:"Open, publicly accessible ground near a station or stop, with whatever is in the way measured along the sun's bearing. Pick one and go — the page never asks where you live.",
 whereNote:"<strong>Every Street View link points at the bearing of the eclipsed sun.</strong> Open it and you are looking at the horizon you will have. The numbers get you to the right field; your own eyes confirm it.",

 citiesEyebrow:"Every city", citiesH2:"Northern Italy, ranked",
 citiesLede:"Sorted by margin — sun altitude minus the measured terrain horizon. This is a <strong>city-centre</strong> figure: a red row means the middle of town is blocked, not that the area is hopeless. The last column links to open ground within reach.",
 tCity:"City", tRegion:"Region", tCovered:"Covered", tSunAlt:"Sun alt.",
 tTerrain:"Terrain", tMarginC:"Margin (centre)", tBearing:"Bearing",
 tMaximum:"Maximum", tSunset:"Sunset", tClearGround:"Clear ground", tSpots:"Spots found",
 citiesWarn:"<b>In the east the sun is partly below the horizon at maximum.</b> In Udine its centre is 0.14° up when the eclipse peaks — less than the sun's own radius, so the bottom of the disc is already cut off. Venice, Bologna, Ferrara, Rovigo and Pordenone are all under 0.35°.",
 citiesNote:"<b>Only Rimini loses the peak outright.</b> There the maximum falls after the sun has gone: 92.7% on paper, 89.8% visible. Trieste and Ravenna scrape in and lose 0.7 and 0.1 points. Every figure in the Covered column is what you can see, not the geometric maximum.",

 truthEyebrow:"Straight talk", truthH2:"What 92% means, and what it does not",
 truthC1H:"Nowhere in Italy sees totality",
 truthC1P1:"The path of totality crosses Greenland, western Iceland and northern Spain, then ends in the Mediterranean well short of Italy. The nearest totality to Milan is about a thousand kilometres away.",
 truthC1P2: "92% is not 92% of the experience. No corona, no darkness, no stars. Those happen at 100% and nowhere else. You get a thin bronze light, a sun bitten down to a crescent, and crescent shadows under every tree.",
 truthC2H:"Still worth going outside for",
 truthC2P1: "It photographs better than it looks through an eyepiece. At 2° you are looking through about thirty atmospheres. The disc will be dim, orange and visibly squashed by refraction, and the seeing will be mush. High magnification shows you soup.",
 truthC2P2:"A 200–400 mm lens on a tripod, a certified front-aperture solar filter, and a ridge or landmark in the foreground will beat any telescope. Compose for the landscape, not the disc.",
 truthOk:"A solar eclipse means a new moon — and this one falls on the night the Perseids peak.",

 nightEyebrow:"The rest of the day", nightH2:"The eclipse is half of it",
 nightLede:"Local times (CEST), evening into the small hours of 13 August.",
 nightNote:"<strong>On the Perseid rate:</strong> sources disagree. The IMO's figure for 2026 is a ZHR of 30–50; some outlets say 100–150. ZHR assumes the radiant overhead and a perfect sky, so under a real dark rural sky expect roughly <strong>40–70 an hour</strong> after midnight, far fewer from a city. The moonless sky is the story, not the rate.",

 safeEyebrow:"Read this first", safeH2:"A 92% sun will still blind you",
 safeC1H:"Never point an unfiltered telescope, camera or binocular at the sun",
 safeC1P1:"The remaining 8% of the disc is exactly as bright per unit area as the full sun. Optics concentrate it. An unfiltered telescope can cause permanent retinal damage faster than your blink reflex, and it is painless while it happens.",
 safeC1P2:"<strong style=\"color:#ff9c9c\">The filter goes on the front of the instrument, never on the eyepiece.</strong> Screw-in eyepiece sun filters crack under concentrated heat. Throw them away.",
 safeC1P3:"Because nowhere in Italy reaches totality, <strong>the filter never comes off — at any moment, at any place on this page.</strong>",
 safeC2H:"What you need",
 safeL1:"<strong>Eyes:</strong> ISO 12312-2 eclipse glasses. Check them against a bright lamp for pinholes and scratches.",
 safeL2:"<strong>Telescope, lens or binoculars:</strong> a full-aperture solar filter covering the whole front opening — Baader AstroSolar film or certified glass. Tape it so a gust cannot lift it.",
 safeL3:"<strong>No filter:</strong> pinhole projection onto white card, or project the image out of an eyepiece. Never look through it.",
 safeL4:"<strong>Cameras:</strong> the filter protects the sensor and shutter too. Live view does not make an unfiltered lens safe.",
 safeWarn:"<b>Sunset is not a filter.</b> At 2° the sun looks tame and orange. It is not. Haze varies minute to minute and can drop several stops without warning. Keep the filter on until the disc is completely below the horizon.",

 methEyebrow:"Method", methH2:"How this was measured, and where it stops",
 methC1H:"What is computed",
 methC1P1:"Contact times, magnitude and obscuration come from the <strong>Besselian elements NASA publishes for this eclipse</strong>, evaluated per coordinate with the standard method. Sun altitude, azimuth and sunset are computed separately. The figure quoted is the maximum coverage <em>visible above the horizon</em>, not the geometric maximum — which is why Trieste and Rimini read lower here than elsewhere.",
 methC1P2:"Horizons are measured, not guessed: <strong>terrain</strong> from the SRTM 30 m elevation model along the sun's bearing to 45 km, corrected for Earth curvature and refraction, and <strong>buildings</strong> from OpenStreetMap in a 2.5 km corridor, using tagged heights where they exist.",
 methC1P3:"Checked against published local circumstances:",
 thCheck:"Check", thThis:"This page", thPublished:"Published",
 methMag:"Milan magnitude", methObsc:"Milan obscuration", methC1t:"Milan first contact",
 methMax:"Milan maximum", methTurin:"Turin obscuration",
 methC1Cap:"Contact times land within about ten seconds of published values. Enough to set up on; not enough to time a contact to the second.",
 methC2H:"What it does <em>not</em> know",
 methN1:"<strong>Small steep hills.</strong> SRTM at 30 m smooths them. It reads Milan's Monte Stella as ~15 m of relief, so that well-known viewpoint does not rank. A low ranking means \"not proven\", not \"ruled out\".",
 methN2:"<strong>How many places were looked at.</strong> Only open spaces named in OpenStreetMap, large enough, and near a stop. In a big city that is hundreds of candidates; in a small one it can be three. A short list means thin mapping, not a bad area — Pavia has the third-best terrain in the region and only three candidates were found.",
 methN3:"<strong>The 12 m assumption.</strong> Every clear spot is re-tested against 20, 30 and 40 m untagged buildings, and the card says where it breaks. Spots with real tagged heights are marked as such.",
 methN4:"<strong>Gaps in the building data.</strong> No buildings along a bearing can mean open countryside, or that nobody mapped them. Where nothing was found but the open ground is shorter than the sun needs, the spot is marked <em>Unverified</em> rather than clear.",
 methN5:"<strong>Trees, walls, scaffolding, parked lorries.</strong> None are in any dataset. At 2° a hedge is a mountain.",
 methN6:"<strong>The weather.</strong> August haze and afternoon storms are common and are the likeliest thing to ruin this. Check a forecast 48 hours out and be ready to move west.",
 methN7:"<strong>Altitude.</strong> Everything assumes sea level. Being 300 m up helps and is not modelled, so the foothills are better than they look here.",
 methNote:"Cross-check timings against <a href=\"http://xjubier.free.fr/en/site_pages/solar_eclipses/TSE_2026_GoogleMapFull.html\">Xavier Jubier's interactive map</a>.",
 methFinalH:"So will this get you a good eclipse?",
 methFinalP: "It puts you on open ground, on the right bearing, at the right minute, with gear that will not hurt you. It cannot give you a clear sky, and it cannot see the row of poplars at the end of the field. Go and stand in your spot the evening before at the same time. The sun will be within a degree of where it needs to be, and you will know in ten seconds.",

 whyC1P:"L'altezza del sole cresce andando a ovest — Venezia 0,26°, Milano 1,92°, Torino 2,56°, Aosta 3,13°. Ma ovest e sud sono esattamente dove stanno Alpi e Appennini. Misurato lungo l'azimut solare di ogni città, fino a 45 km:",

var SUNDIA = 0.53, TZ = 2;

/* ---------- language ---------- */
var LANG = "en";
try {
  var saved = localStorage.getItem("ecl-lang");
  if (saved === "en" || saved === "it") LANG = saved;
  else if ((navigator.language || "").slice(0,2).toLowerCase() === "it") LANG = "it";
} catch(e) {}
function t(k){ var d = I18N[LANG] || I18N.en; return (d[k] != null ? d[k] : (I18N.en[k] != null ? I18N.en[k] : k)); }
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_,k){ return o[k] != null ? o[k] : ""; }); }
function num(n, dp){
  var s = (dp == null) ? String(n) : Number(n).toFixed(dp);
  return LANG === "it" ? s.replace(".", ",") : s;
}

/* ---------- helpers ---------- */
function fmt(iso){ if(!iso) return "—";
  var d=new Date(new Date(iso).getTime()+TZ*3600000), p=function(n){return(n<10?"0":"")+n;};
  return p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds()); }
function card8(az){ var d=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"],
      e=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return (LANG==="it"?d:e)[Math.round(az/22.5)%16]; }
function metres(m){ return m>=1000 ? num(m/1000,1)+" km" : Math.round(m)+" m"; }
function areaTxt(a){ return a>=1e6 ? num(a/1e6,1)+" km²" : Math.round(a/10000)+" ha"; }
function plural(n, one, many){ return n+" "+(n===1?one:many); }
function verdict(cl){ var d=Math.round((cl/SUNDIA)*10)/10;
  if(d>=2) return {k:"clear",cls:"clear",label:t("vClear")};
  if(d>=1) return {k:"work",cls:"clear",label:t("vWork")};
  if(d>0)  return {k:"tight",cls:"tight",label:t("vTight")};
  return {k:"blocked",cls:"blocked",label:t("vBlocked")}; }
function verdictFor(s,c){
  var v=verdict(s.clearance);
  if(v.k!=="blocked" && s.bldg<0.01 && s.fetch < c.need15)
    return {k:"unver",cls:"tight",label:t("vUnver")};
  return v; }
function diaTxt(cl){ var d=cl/SUNDIA;
  return d<=0 ? fill(t("diaBelow"),{n:num(Math.abs(d),1)}) : fill(t("diaAbove"),{n:num(d,1)}); }
function stopKind(k){ return {metro:t("kMetro"),tram:t("kTram"),rail:t("kRail"),
  bus:t("kBus"),interchange:t("kInter"),stop:t("kStop")}[k] || t("kStop"); }
function stopLabel(s){ var k=stopKind(s.stop_kind);
  var d=(s.stop_d_used!=null)?s.stop_d_used:Math.min(s.stop_d,s.rail_d);
  return (s.stop_name || (t("kUnnamed")+" "+k))+" · "+k+" · "+Math.round(d)+" "+t("kWalk"); }
var IT_NAME={Milan:"Milano",Turin:"Torino",Genoa:"Genova",Venice:"Venezia",
  Padua:"Padova",Mantua:"Mantova"};
var IT_REG={Piedmont:"Piemonte","Aosta Valley":"Valle d'Aosta",Lombardy:"Lombardia"};
function cityName(n){ return LANG==="it" ? (IT_NAME[n]||n) : n; }
function regName(r){ return LANG==="it" ? (IT_REG[r]||r) : r; }
function byName(n){ for(var i=0;i<CITIES.length;i++) if(CITIES[i].n===n) return CITIES[i]; return null; }
function robustness(s,c){
  if(s.clearance<=0) return null;
  if(s.bldg_measured) return {tagged:true};
  if(s.bldg_d==null) return {none:true};
  for(var H=14; H<=40; H+=2){
    if(c.alt-Math.max(s.terrain, Math.atan2(H-1.6,s.bldg_d)*180/Math.PI)<=0) return {flip:H};
  }
  return {flip:null};
}

/* ---------- directory ---------- */
var DFILT={clear:true,rail:false,q:""};
function drawDirectory(){
  var host=document.getElementById("directory"),out=[],nC=0,nS=0,nB=0;
  // useful cities first: those with a clear spot, best margin at the top;
  // cities where nothing clears drop to the bottom rather than leading the list
  function bestClear(rec){
    var ok=(rec.spots||[]).filter(function(s){return s.clearance>0;});
    return ok.length ? Math.max.apply(null, ok.map(function(s){return s.clearance;})) : -Infinity;
  }
  Object.keys(SPOTS).map(function(k){ return SPOTS[k]; })
   .sort(function(a,b){
     var A=bestClear(a), B=bestClear(b);
     if(A!==B) return B-A;
     var ca=byName(a.city), cb=byName(b.city);
     return (cb?cb.margin:0)-(ca?ca.margin:0);
   })
   .forEach(function(c){
    if(!c.spots||!c.spots.length) return;
    var meta=byName(c.city); if(!meta) return;
    var q=DFILT.q.toLowerCase();
    var sp=c.spots.filter(function(s){
      if(DFILT.clear&&s.clearance<=0) return false;
      if(DFILT.rail&&["metro","tram","rail"].indexOf(s.stop_kind)<0) return false;
      if(q&&(c.city+" "+cityName(c.city)+" "+meta.reg+" "+regName(meta.reg)+" "+s.name)
             .toLowerCase().indexOf(q)<0) return false;
      return true; });
    if(!sp.length){
      if(DFILT.clear && c.spots.length && (!q ||
          (c.city+" "+cityName(c.city)+" "+meta.reg+" "+regName(meta.reg)).toLowerCase().indexOf(q)>=0)){
        var best=c.spots.reduce(function(a,b){return b.clearance>a.clearance?b:a;});
        nB++;
        var why = best.terrain>=best.bldg
          ? fill(t("blkTerrain"),{a:num(best.terrain,2),d:num(best.terrain_at/1000,0)})
          : (best.bldg_h ? fill(t("blkBldgAt"),{a:num(best.bldg,2),h:Math.round(best.bldg_h),d:Math.round(best.bldg_d)})
                         : fill(t("blkBldg"),{a:num(best.bldg,2)}));
        var advice = meta.need15>2000
          ? fill(t("blkPhys"),{alt:num(meta.alt,2),need:metres(meta.need15),city:cityName(c.city)})
          : (best.terrain>=best.bldg ? t("blkHills") : t("blkBuilt"));
        out.push('<div class="citygrp"><div class="cityhead"><h3>'+cityName(c.city)+'</h3>'+
          '<span class="reg">'+regName(meta.reg)+'</span><span class="what">'+
          num(meta.obsc,1)+'% '+t("covered")+' · '+t("sunAt")+' '+num(meta.alt,2)+'°</span></div>'+
          '<div class="warn"><b>'+t("blkTitle")+'</b> '+
          fill(t("blkBody"),{n:c.spots.length,city:cityName(c.city),name:best.name,
                             d:num(Math.abs(best.clearance/SUNDIA),1),why:why})+
          ' '+advice+' '+t("blkToggle")+'</div></div>');
      }
      return;
    }
    nC++; nS+=sp.length;
    out.push('<div class="citygrp"><div class="cityhead"><h3>'+cityName(c.city)+'</h3>'+
      '<span class="reg">'+regName(meta.reg)+'</span><span class="what">'+
      num(meta.obsc,1)+'% '+t("covered")+' · '+t("sunAt")+' '+num(meta.alt,1)+'° '+
      Math.round(meta.az)+'° '+card8(meta.az)+' · '+t("maxAt")+' '+fmt(meta.max)+'</span></div>'+
      '<div class="sgrid">'+sp.map(function(s){return spotCard(s,meta);}).join("")+'</div></div>');
  });
  host.innerHTML=out.join("");
  document.getElementById("dnone").style.display=(nS||nB)?"none":"block";
  document.getElementById("dcounts").textContent=
    plural(nS,t("cSpot"),t("cSpots"))+" "+t("cAcross")+" "+plural(nC,t("cCity"),t("cCities"))+
    (nB?" · "+plural(nB,t("cCity"),t("cCities"))+" "+t("cNoClear"):"")+
    (DFILT.clear?" · "+t("cOnlyClear"):"");
}
function spotCard(s,c){
  var v=verdictFor(s,c),az=Math.round(c.az),ll=s.lat.toFixed(5)+","+s.lon.toFixed(5);
  var frac=Math.max(0,Math.min(1,s.clearance/Math.max(c.alt,.01)));
  var col=v.k==="blocked"?"#ff6b6b":(v.k==="tight"||v.k==="unver")?"#f5c451":"#5fd6a0";
  var blocker = s.horizon<0.02 ? t("blkNothing")
    : (s.terrain>=s.bldg
        ? fill(t("blkTerrain"),{a:num(s.terrain,2),d:num(s.terrain_at/1000,1)})
        : (s.bldg_h ? fill(t("blkBldgAt"),{a:num(s.bldg,2),h:Math.round(s.bldg_h),d:Math.round(s.bldg_d)})
                    : fill(t("blkBldg"),{a:num(s.bldg,2)})));
  var r=robustness(s,c), rob="";
  if(r){
    if(r.tagged) rob='<div class="est" style="color:var(--grn)">'+t("robTagged")+'</div>';
    else if(r.none) rob="";
    else if(r.flip===null) rob='<div class="est" style="color:var(--grn)">'+t("robRobust")+'</div>';
    else if(r.flip<=20) rob='<div class="est" style="color:#ffb3b3">'+fill(t("robFragile"),{h:r.flip})+'</div>';
    else rob='<div class="est">'+fill(t("robHolds"),{h:r.flip})+'</div>';
  }
  return '<div class="scard '+v.cls+'"><span class="vb '+v.k+'">'+v.label+'</span>'+
    '<h4>'+s.name+'</h4><div class="kind">'+s.kind.replace(/_/g," ")+' · '+areaTxt(s.area)+'</div>'+
    '<div class="bar"><i style="width:'+(frac*100).toFixed(0)+'%;background:'+col+'"></i></div>'+
    '<dl class="ev">'+
      '<dt>'+t("lClearance")+'</dt><dd><b>'+(s.clearance>0?"+":"−")+num(Math.abs(s.clearance),2)+'°</b> — '+diaTxt(s.clearance)+'</dd>'+
      '<dt>'+t("lInWay")+'</dt><dd>'+blocker+'</dd>'+
      '<dt>'+t("lOpen")+'</dt><dd><b>'+metres(s.fetch)+'</b> '+fill(t("needFor"),{az:az,d:metres(c.need15)})+'</dd>'+
      '<dt>'+t("lTransit")+'</dt><dd>'+stopLabel(s)+'</dd></dl>'+
    '<div class="links">'+
      '<a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+ll+'&heading='+az+'&pitch=5&fov=80">'+fill(t("linkSV"),{az:az})+'</a>'+
      '<a target="_blank" rel="noopener" href="https://earth.google.com/web/@'+s.lat.toFixed(5)+','+s.lon.toFixed(5)+',0a,2500d,35y,'+az+'h,85t,0r">'+t("linkEarth")+'</a>'+
      '<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=transit">'+t("linkGo")+'</a>'+
    '</div>'+ rob +
    (v.k==="unver" ? '<div class="est">'+fill(t("unverNote"),{f:metres(s.fetch),n:metres(c.need15)})+'</div>' : '')+
  '</div>';
}

/* ---------- eclipse engine: NASA/GSFC Besselian elements for 2026 Aug 12 ---------- */
var BE={t0:Date.UTC(2026,7,12,18,0,0), dT:69.2,
  X:[0.4755140,0.5189249,-0.0000773,-0.0000080],
  Y:[0.7711830,-0.2301680,-0.0001246,0.0000038],
  D:[14.7966700,-0.0120650,-0.0000030,0],
  E1:[0.5379550,0.0000939,-0.0000121,0],
  E2:[-0.0081420,0.0000935,-0.0000121,0],
  MU:[88.747787,15.003090,0,0], TF1:0.0046141, TF2:0.0045911};
var DEGR=Math.PI/180;
function bpoly(c,t){ return c[0]+t*(c[1]+t*(c[2]+t*c[3])); }
function beObs(lat,lon){
  var L=lat*DEGR, u=Math.atan(0.99664719*Math.tan(L));
  return {rs:0.99664719*Math.sin(u), rc:Math.cos(u), lon:lon, lat:lat};
}
function beObsc(m,l1,l2){
  var rS=(l1+l2)/2, rM=(l1-l2)/2;
  if(m>=rS+rM) return 0;
  if(m<=Math.abs(rM-rS)) return rM>=rS?1:(rM*rM)/(rS*rS);
  var a1=Math.acos((rS*rS+m*m-rM*rM)/(2*rS*m)),
      a2=Math.acos((rM*rM+m*m-rS*rS)/(2*rM*m));
  return (rS*rS*(a1-Math.sin(2*a1)/2)+rM*rM*(a2-Math.sin(2*a2)/2))/(Math.PI*rS*rS);
}
function beAt(ms, ob){
  var t=(ms-BE.t0)/3600000 + BE.dT/3600;
  var x=bpoly(BE.X,t), y=bpoly(BE.Y,t), d=bpoly(BE.D,t)*DEGR,
      mu=bpoly(BE.MU,t), l1=bpoly(BE.E1,t), l2=bpoly(BE.E2,t);
  var H=(mu+ob.lon-0.00417807*BE.dT)*DEGR;
  var xi=ob.rc*Math.sin(H),
      eta=ob.rs*Math.cos(d)-ob.rc*Math.cos(H)*Math.sin(d),
      zet=ob.rs*Math.sin(d)+ob.rc*Math.cos(H)*Math.cos(d);
  var u=x-xi, v=y-eta;
  var L1=l1-zet*BE.TF1, L2=l2-zet*BE.TF2;
  var m=Math.hypot(u,v), rS=(L1+L2)/2, rM=(L1-L2)/2;
  // parallactic angle: rotates the moon's offset from equatorial into the horizon frame
  var q=Math.atan2(Math.sin(H), Math.tan(ob.lat*DEGR)*Math.cos(d)-Math.sin(d)*Math.cos(H));
  return {obsc:beObsc(m,L1,L2), sep:m/rS, kMoon:rM/rS, theta:Math.atan2(u,v)-q};
}
/* sun altitude & azimuth (NOAA), validated against published circumstances */
function sunAltAz(ms, lat, lon){
  var jd=ms/86400000+2440587.5, T=(jd-2451545)/36525;
  var L0=(280.46646+T*(36000.76983+T*0.0003032))%360;
  var M=357.52911+T*(35999.05029-0.0001537*T), e=0.016708634-T*(0.000042037+0.0000001267*T);
  var Mr=M*DEGR;
  var C=Math.sin(Mr)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*Mr)*(0.019993-0.000101*T)
       +Math.sin(3*Mr)*0.000289;
  var om=125.04-1934.136*T, app=(L0+C)-0.00569-0.00478*Math.sin(om*DEGR);
  var sec=21.448-T*(46.8150+T*(0.00059-T*0.001813));
  var eps=(23+(26+sec/60)/60)+0.00256*Math.cos(om*DEGR);
  var eR=eps*DEGR, aR=app*DEGR, dec=Math.asin(Math.sin(eR)*Math.sin(aR));
  var yy=Math.tan(eR/2)*Math.tan(eR/2), L0r=L0*DEGR;
  var Eq=4/DEGR*(yy*Math.sin(2*L0r)-2*e*Math.sin(Mr)+4*e*yy*Math.sin(Mr)*Math.cos(2*L0r)
        -0.5*yy*yy*Math.sin(4*L0r)-1.25*e*e*Math.sin(2*Mr));
  var dt=new Date(ms);
  var um=dt.getUTCHours()*60+dt.getUTCMinutes()+dt.getUTCSeconds()/60;
  var tst=(um+Eq+4*lon)%1440, ha=tst/4-180; if(ha<-180) ha+=360;
  var hR=ha*DEGR, lR=lat*DEGR;
  var alt=Math.asin(Math.sin(lR)*Math.sin(dec)+Math.cos(lR)*Math.cos(dec)*Math.cos(hR))/DEGR;
  var az=(Math.atan2(-Math.sin(hR), Math.tan(dec)*Math.cos(lR)-Math.sin(lR)*Math.cos(hR))/DEGR+360)%360;
  var ta=Math.tan(alt*DEGR), R;
  if(alt>85) R=0;
  else if(alt>5) R=58.1/ta-0.07/(ta*ta*ta)+0.000086/Math.pow(ta,5);
  else if(alt>-0.575) R=1735+alt*(-518.2+alt*(103.4+alt*(-12.79+alt*0.711)));
  else R=-20.772/ta;
  return {alt:alt+R/3600, az:az};
}

/* ---------- animation ----------
   Fixed frame, true angular scale on both axes: the sun really does travel that
   path relative to its own diameter. Built once, then only attributes change,
   so it stays smooth on a phone. */
var ANIM={playing:false, cur:0, t0:0, t1:0, raf:null, last:0, DUR:24000, built:false};
var AW=900, AH=470, AX0=70, AX1=830, AY0=50, AYH=390;   // AYH = the true horizon
function animCity(){ return byName(SEE_CITY)||byName("Milan"); }

function animSetup(){
  var c=animCity();
  ANIM.city=c.n;
  ANIM.ob=beObs(c.lat,c.lon);
  ANIM.t0=Date.parse(c.c1);
  ANIM.t1=Math.min(Date.parse(c.c4), Date.parse(c.sunset)+60000);
  var p0=sunAltAz(ANIM.t0,c.lat,c.lon), p1=sunAltAz(ANIM.t1,c.lat,c.lon);
  ANIM.altMax=Math.max(3, p0.alt*1.06);
  ANIM.pd=(AYH-AY0)/ANIM.altMax;                       // px per degree, both axes
  ANIM.az0=p0.az; ANIM.az1=p1.az;
  var span=Math.max(0.5,(p1.az-p0.az))*ANIM.pd;
  ANIM.x0=(AX0+AX1)/2-span/2;
  ANIM.sunR=0.265*ANIM.pd;
  ANIM.cur=Math.min(Math.max(Date.parse(c.max),ANIM.t0),ANIM.t1);
  ANIM.fresh=true;
  ANIM.built=false;
  animBuild();
  animUpdate();
}
function animXY(ms){
  var c=animCity(), p=sunAltAz(ms,c.lat,c.lon);
  return {x:ANIM.x0+(p.az-ANIM.az0)*ANIM.pd, y:AYH-p.alt*ANIM.pd, alt:p.alt, az:p.az};
}
function animBuild(){
  var c=animCity();
  // the sun's track, so its descent is legible even when paused
  var path="", N=40;
  for(var i=0;i<=N;i++){
    var q=animXY(ANIM.t0+(ANIM.t1-ANIM.t0)*i/N);
    path+=(i?"L":"M")+q.x.toFixed(1)+","+q.y.toFixed(1);
  }
  // altitude ticks
  var step=ANIM.altMax>8?2:(ANIM.altMax>4?1:0.5), ticks="";
  for(var a=0;a<=ANIM.altMax+1e-9;a+=step){
    var y=AYH-a*ANIM.pd;
    ticks+='<line x1="'+AX0+'" y1="'+y.toFixed(1)+'" x2="'+AX1+'" y2="'+y.toFixed(1)+
      '" stroke="#26314b" stroke-width="1" stroke-dasharray="3 7"/>'+
      '<text x="'+(AX0-10)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" fill="#6b7691" '+
      'font-family="ui-monospace,monospace" font-size="13">'+num(a,step<1?1:0)+'°</text>';
  }
  // a distant treeline and rooftops, tops sitting exactly on the horizon
  var g="M0,"+AH+" L0,"+AYH+" ";
  var seed=[14,9,22,11,7,26,12,18,8,30,10,16,9,24,13,20,8,15,11,28,9,17,12,21,10];
  var x=0, i=0;
  while(x<AW){
    var w=26+(seed[i%seed.length]%9)*7, h=seed[i%seed.length];
    if(i%3===2){ // rooftop
      g+="L"+x+","+(AYH-h*0.55).toFixed(1)+" L"+(x+w/2).toFixed(1)+","+(AYH-h*0.95).toFixed(1)+
         " L"+(x+w).toFixed(1)+","+(AYH-h*0.55).toFixed(1)+" ";
    } else {   // tree
      g+="L"+x+","+(AYH-h*0.35).toFixed(1)+" Q"+(x+w/2).toFixed(1)+","+(AYH-h*1.25).toFixed(1)+
         " "+(x+w).toFixed(1)+","+(AYH-h*0.35).toFixed(1)+" ";
    }
    x+=w; i++;
  }
  g+="L"+AW+","+AYH+" L"+AW+","+AH+" Z";

  var insetR=86, insetX=AW-insetR-34, insetY=insetR+34;
  document.getElementById("animsvg").innerHTML=
  '<svg viewBox="0 0 '+AW+' '+AH+'" role="img" aria-label="'+esc(cityName(c.n))+'">'+
  '<defs>'+
    '<linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">'+
      '<stop id="a-sky0" offset="0%" stop-color="#121b31"/>'+
      '<stop id="a-sky1" offset="100%" stop-color="#3a2519"/></linearGradient>'+
    '<radialGradient id="a-glow"><stop offset="0%" stop-color="#ffce69" stop-opacity=".5"/>'+
      '<stop offset="100%" stop-color="#ffce69" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="a-disc"><stop offset="0%" stop-color="#fff3cd"/>'+
      '<stop offset="62%" stop-color="#f8c94f"/><stop offset="100%" stop-color="#e2831f"/></radialGradient>'+
    '<clipPath id="a-clip"><rect x="0" y="0" width="'+AW+'" height="'+AYH+'"/></clipPath>'+
    '<clipPath id="a-inclip"><circle cx="'+insetX+'" cy="'+insetY+'" r="'+insetR+'"/></clipPath>'+
  '</defs>'+
  '<rect width="'+AW+'" height="'+AH+'" fill="url(#a-sky)"/>'+ticks+
  
  '<path id="a-track" d="'+path+'" fill="none" stroke="#5c6b8f" stroke-width="1.2" '+
    'stroke-dasharray="2 6" opacity=".75"/>'+
  '<g clip-path="url(#a-clip)">'+
    '<circle id="a-glowc" cx="0" cy="0" r="'+(ANIM.sunR*5).toFixed(1)+'" fill="url(#a-glow)"/>'+
    '<circle id="a-sun" cx="0" cy="0" r="'+ANIM.sunR.toFixed(2)+'" fill="url(#a-disc)"/>'+
    '<circle id="a-moon" cx="0" cy="0" r="0" fill="#0d1220" stroke="#48587a" stroke-width="1"/>'+
  '</g>'+
  '<line x1="0" y1="'+AYH+'" x2="'+AW+'" y2="'+AYH+'" stroke="#8090b4" stroke-width="1.2" '+
    'stroke-dasharray="7 6" opacity=".7"/>'+
  '<path d="'+g+'" fill="#070b12"/>'+
  // magnified view, so the crescent is readable at true shape
  '<circle cx="'+insetX+'" cy="'+insetY+'" r="'+insetR+'" fill="#0a0f1a" stroke="#33405e"/>'+
  '<g clip-path="url(#a-inclip)">'+
    '<circle id="a-isun" cx="'+insetX+'" cy="'+insetY+'" r="'+(insetR*0.62).toFixed(1)+'" fill="url(#a-disc)"/>'+
    '<circle id="a-imoon" cx="0" cy="0" r="0" fill="#0a0f1a" stroke="#3d4a68" stroke-width="1"/>'+
  '</g>'+
  '<text x="'+insetX+'" y="'+(insetY+insetR+20)+'" text-anchor="middle" fill="#6b7691" '+
    'font-family="ui-monospace,monospace" font-size="12">'+t("animZoom")+'</text>'+
  '<text id="a-city" x="'+AX0+'" y="'+(AH-22)+'" fill="#8b97ad" '+
    'font-family="ui-monospace,monospace" font-size="14"></text>'+
  '<text x="'+AX0+'" y="30" fill="#c3cddf" font-family="ui-monospace,monospace" '+
    'font-size="13">'+t("animHorizonNote")+'</text>'+
  '</svg>';
  ANIM.inset={x:insetX,y:insetY,r:insetR*0.62};
  ANIM.built=true;
}
function animUpdate(){
  if(!ANIM.built) return;
  var c=animCity(), ms=ANIM.cur;
  var e=beAt(ms, ANIM.ob), q=animXY(ms);
  var below=q.alt<=-0.2665;
  var k=Math.max(0,Math.min(1,q.alt/8));
  function mix(a,b){ return Math.round(a+(b-a)*(1-k)); }
  document.getElementById("a-sky0").setAttribute("stop-color",
    "rgb("+mix(18,40)+","+mix(27,22)+","+mix(49,32)+")");
  document.getElementById("a-sky1").setAttribute("stop-color",
    "rgb("+mix(58,168)+","+mix(37,70)+","+mix(25,40)+")");

  var mx=q.x+e.sep*ANIM.sunR*Math.sin(e.theta), my=q.y-e.sep*ANIM.sunR*Math.cos(e.theta);
  function set(id,a){ var el=document.getElementById(id); for(var kk in a) el.setAttribute(kk,a[kk]); }
  set("a-sun",{cx:q.x.toFixed(1), cy:q.y.toFixed(1), opacity:below?0:1});
  set("a-glowc",{cx:q.x.toFixed(1), cy:q.y.toFixed(1), opacity:below?0:1});
  set("a-moon",{cx:mx.toFixed(1), cy:my.toFixed(1),
                r:(ANIM.sunR*e.kMoon).toFixed(2), opacity:below?0:1});

  var ix=ANIM.inset.x+e.sep*ANIM.inset.r*Math.sin(e.theta),
      iy=ANIM.inset.y-e.sep*ANIM.inset.r*Math.cos(e.theta);
  set("a-imoon",{cx:ix.toFixed(1), cy:iy.toFixed(1), r:(ANIM.inset.r*e.kMoon).toFixed(2)});
  set("a-isun",{opacity:below?.25:1});
  document.getElementById("a-city").textContent=
    cityName(c.n)+" · "+Math.round(q.az)+"° "+card8(q.az);

  var maxMs=Date.parse(c.max);
  var phase = below ? t("phSet")
            : (Math.abs(ms-maxMs)<45000 ? t("phMax")
            : (q.alt<0.6 ? t("phSetting") : t("phPartial")));
  document.getElementById("rdTime").textContent=fmt(new Date(ms).toISOString());
  document.getElementById("rdCov").textContent=below?"—":num(e.obsc*100,1)+"%";
  document.getElementById("rdAlt").textContent=below?"—":num(Math.max(q.alt,0),2)+"°";
  document.getElementById("rdPhase").textContent=phase;
  var r=document.getElementById("animrange");
  if(r && document.activeElement!==r)
    r.value=Math.round((ms-ANIM.t0)/(ANIM.t1-ANIM.t0)*1000);
}
function animFrame(ts){
  if(!ANIM.playing) return;
  if(!ANIM.last) ANIM.last=ts;
  var dt=ts-ANIM.last; ANIM.last=ts;
  ANIM.cur += dt/ANIM.DUR*(ANIM.t1-ANIM.t0);
  if(ANIM.cur>=ANIM.t1){ ANIM.cur=ANIM.t1; animUpdate(); animPause(); return; }
  animUpdate();
  ANIM.raf=requestAnimationFrame(animFrame);
}
function animPlay(){
  if(ANIM.fresh || ANIM.cur>=ANIM.t1) ANIM.cur=ANIM.t0;
  ANIM.fresh=false; ANIM.playing=true; ANIM.last=0;
  document.getElementById("animbtn").textContent=t("animPause");
  ANIM.raf=requestAnimationFrame(animFrame);
}
function animPause(){
  ANIM.playing=false;
  if(ANIM.raf) cancelAnimationFrame(ANIM.raf);
  document.getElementById("animbtn").textContent=
    (ANIM.cur>=ANIM.t1) ? t("animReplay") : t("animPlay");
}
function animWire(){
  var b=document.getElementById("animbtn"), r=document.getElementById("animrange");
  b.onclick=function(){ ANIM.playing?animPause():animPlay(); };
  function scrub(){ animPause();
    ANIM.cur=ANIM.t0+(ANIM.t1-ANIM.t0)*(+r.value/1000);
    ANIM.fresh=false; animUpdate(); }
  r.oninput=scrub; r.onchange=scrub;
}

/* ---------- to-scale diagram ---------- */
var SEE_CITY="Milan", SEE_TABS=["Milan", "Novara", "Vercelli", "Pavia", "Monza", "Lodi", "Alessandria", "Cremona", "Brescia", "Bergamo", "Turin", "Verona", "Bologna", "Venice", "Genoa", "Aosta"];
function seeState(c){
  var R=SUNDIA/2;
  if(c.alt-R >= c.terr) return c.margin>=SUNDIA ? "clear" : "tight";
  if(c.alt+R >  c.terr) return c.margin>0 ? "clipped" : "peek";
  return "hidden";
}
function visCell(c){
  var st=seeState(c);
  var lab = st==="hidden" ? t("vNo") : (st==="clear"||st==="tight") ? t("vYes") : t("vPartly");
  var col = st==="hidden" ? "var(--red)" : (st==="clear"||st==="tight") ? "var(--grn)" : "var(--gold)";
  var tip = {clear:t("vYesRoom"), tight:t("vYesTight"), clipped:t("vClipT"),
             peek:t("vPeekT"), hidden:t("vNoT")}[st];
  return '<span class="vlab" style="color:'+col+'">'+lab+'</span>'+
         '<span class="vtip"> · '+tip+'</span>';
}
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function drawSee(){
  var c=byName(SEE_CITY)||byName("Milan"); if(!c) return;
  var alt=c.alt, terr=c.terr, marg=c.margin, RAD=SUNDIA/2;
  var W=900,H=430,L=92,RX=858,T=44,B=352;

  var clipped=terr>top;
  var pd=(B-T)/top;
  function y(d){ return B-Math.min(d,top)*pd; }
  var sunX=560, sr=Math.max(4,RAD*pd);

  var steps=[0.25,0.5,1,2,5,10], step=steps[steps.length-1];
  for(var i=0;i<steps.length;i++){ if(top/steps[i]<=7){ step=steps[i]; break; } }
  var ticks="";
  for(var d=0; d<=top+1e-9; d+=step){
    var yy=y(d);
    ticks+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+RX+'" y2="'+yy.toFixed(1)+
      '" stroke="#222c46" stroke-width="1"'+(d===0?'':' stroke-dasharray="3 6"')+'/>'+

      'font-family="ui-monospace,monospace" font-size="13">'+num(d, step<1?2:0)+'°</text>';
  }

  var ty=y(terr), gy=y(0);
  var prof=[[L,ty+8],[L+130,ty+2],[L+260,ty-4],[L+390,ty+5],[L+520,ty-2],[L+660,ty+4],[RX,ty+1]];
  var poly=prof.map(function(p){return p[0].toFixed(0)+","+p[1].toFixed(1);}).join(" ")+
           " "+RX+","+(B+34)+" "+L+","+(B+34);

  var mcol = marg>0 ? "#5fd6a0" : "#ff6b6b";

    '<radialGradient id="sundisc"><stop offset="0%" stop-color="#ffeeb8"/>'+

    '<rect x="'+L+'" y="'+T+'" width="'+(RX-L)+'" height="'+(B-T)+'" fill="url(#sky)"/>'+ticks+

    '<polyline points="'+prof.map(function(p){return p[0].toFixed(0)+","+p[1].toFixed(1);}).join(" ")+

    ((hidden||partial)
      ? '<circle cx="'+sunX+'" cy="'+y(alt).toFixed(1)+'" r="'+sr.toFixed(1)+
        '" fill="none" stroke="#f5c451" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>'

    '<text x="'+sunX+'" y="'+Math.max(T+16,y(alt)-sr-14).toFixed(1)+'" text-anchor="middle" '+
      'fill="#ffdc8a" font-family="ui-monospace,monospace" font-size="14">'+
      t("seeSun")+' · '+num(alt,2)+'°</text>'+
    '<text x="'+(L+14)+'" y="'+Math.max(T+18,Math.min(ty-12,B-8)).toFixed(1)+'" fill="#c3cddf" '+

      '" stroke="'+mcol+'" stroke-width="2"/>'+

    '<text x="'+(RX-56)+'" y="'+((ty+y(alt))/2+5).toFixed(1)+'" fill="'+mcol+'" '+

      (marg>0?"+":"−")+num(Math.abs(marg),2)+'°</text>'+
    '<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+RX+'" y2="'+gy.toFixed(1)+
      '" stroke="#7d8db0" stroke-width="1" stroke-dasharray="6 5" opacity=".8"/>'+
    '<text x="'+L+'" y="'+(H-8)+'" fill="#6b7691" font-family="ui-monospace,monospace" '+

  document.getElementById("seesvg").innerHTML=svg;

  var st=seeState(c), widths=num(Math.abs(marg/SUNDIA),1);
  var key={clear:"seeVerdictClear",tight:"seeVerdictTight",clipped:"seeVerdictClipped",

var sortK="margin", asc=false;
function drawTable(){
  var rows=CITIES.slice().sort(function(a,b){
    var x=a[sortK],y=b[sortK];
    if(sortK==="n"){ x=cityName(x); y=cityName(y); }
    if(sortK==="reg"){ x=regName(x); y=regName(y); }
    if(typeof x==="string") return asc?x.localeCompare(y):y.localeCompare(x);
    return asc?x-y:y-x; });
  document.querySelector("#ctbl tbody").innerHTML=rows.map(function(c){
    var rec=SPOTS[c.n], nOK=rec&&rec.spots?rec.spots.filter(function(s){return s.clearance>0;}).length:0;
    var cls=nOK?((c.margin>=1.3||nOK>=3)?"best":""):((c.setsFirst||c.margin<=0)?"bad":"");
    return '<tr class="'+cls+'"><td><strong>'+cityName(c.n)+'</strong></td>'+
      '<td style="color:var(--dim)">'+regName(c.reg)+'</td>'+
      '<td class="num">'+num(c.obsc,1)+'%'+
        (c.loss>=0.15?'<span style="color:var(--dim2)"> ('+num(c.geo,1)+')</span>':'')+'</td>'+
      '<td class="num">'+(c.setsFirst?'<span style="color:var(--red)">'+t("setsFirst")+'</span>'
          :(c.alt<0.28?'<span style="color:var(--gold)">'+num(c.alt,2)+'°</span>':num(c.alt,1)+'°'))+'</td>'+
      '<td class="num">'+num(c.terr,2)+'°</td>'+
      '<td class="num" style="color:'+(c.margin>0.8?"var(--grn)":c.margin>0?"var(--gold)":"var(--red)")+'">'+
        (c.margin>0?"+":"−")+num(Math.abs(c.margin),2)+'°</td>'+
      '<td class="num">'+Math.round(c.az)+'° '+card8(c.az)+'</td>'+
      '<td class="num">'+fmt(c.max)+'</td><td class="num">'+fmt(c.sunset)+'</td>'+
      '<td class="num">'+(c.setsFirst?"—":metres(c.need15))+'</td>'+
      '<td class="num">'+spotCell(c.n)+'</td></tr>'; }).join("");
}

function drawTimeline(){
  document.getElementById("timeline").innerHTML=(EVENTS[LANG]||EVENTS.en).map(function(e){
    return '<div class="evt'+(e[3]?"":" dim")+'"><time>'+e[0]+'</time><h4>'+e[1]+'</h4><p>'+e[2]+'</p></div>';
  }).join("");
}

/* ---------- map ---------- */
var MAP=null, cityLayer=null, spotLayer=null;
function drawMap(){
  if(!window.L) return;
  if(!MAP){
    MAP=L.map("map",{scrollWheelZoom:false}).setView([45.5,10.0],7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {attribution:"&copy; OpenStreetMap &copy; CARTO",maxZoom:18}).addTo(MAP);
  }
  if(cityLayer) MAP.removeLayer(cityLayer);
  if(spotLayer) MAP.removeLayer(spotLayer);
  cityLayer=L.layerGroup(); spotLayer=L.layerGroup();
  CITIES.forEach(function(c){
    var col=c.setsFirst?"#ff6b6b":"#6fb3ff";
    L.circleMarker([c.lat,c.lon],{radius:Math.max(4,3+Math.max(c.alt,0)*1.8),color:col,
      weight:1.4,fillColor:col,fillOpacity:.25})
     .bindPopup("<strong>"+cityName(c.n)+"</strong><br>"+num(c.obsc,1)+"% "+t("covered")+"<br>"+t("sunAt")+" "+
       (c.setsFirst?t("popAlreadySet"):num(c.alt,2)+"° "+Math.round(c.az)+"°")+
       "<br>"+t("maxAt")+" "+fmt(c.max)+" · "+t("popSunset")+" "+fmt(c.sunset))
     .addTo(cityLayer);
  });
  Object.keys(SPOTS).forEach(function(k){
    var c=SPOTS[k],meta=byName(c.city); if(!meta) return;
    (c.spots||[]).forEach(function(s){
      var v=verdictFor(s,meta);
      var col=v.k==="blocked"?"#ff6b6b":(v.k==="tight"||v.k==="unver")?"#f5c451":"#5fd6a0";
      L.circleMarker([s.lat,s.lon],{radius:4,color:col,weight:1,fillColor:col,fillOpacity:.85})
       .bindPopup("<strong>"+s.name+"</strong><br>"+cityName(c.city)+" — "+v.label+
         "<br>"+t("popClearance")+" "+(s.clearance>0?"+":"−")+num(Math.abs(s.clearance),2)+"°, "+
         metres(s.fetch)+" "+t("popOpen")+"<br><a target='_blank' rel='noopener' href='"+
         "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="+s.lat.toFixed(5)+","+
         s.lon.toFixed(5)+"&heading="+Math.round(meta.az)+"&pitch=5&fov=80'>"+
         fill(t("linkSV"),{az:Math.round(meta.az)})+"</a>")
       .addTo(spotLayer);
    });
  });
  cityLayer.addTo(MAP); spotLayer.addTo(MAP);
}

/* ---------- tabs ---------- */
var TABS=[{id:"safety",k:"navSafety",danger:true},{id:"night",k:"navNight"},
          {id:"where",k:"navWhere"},{id:"cities",k:"navCities"},{id:"method",k:"navMethod"}];
var CURTAB=TABS[0].id;
function buildTabs(){
  document.getElementById("tabrow").innerHTML=TABS.map(function(x){
    return '<button role="tab" data-tab="'+x.id+'"'+(x.danger?' class="danger"':'')+
           ' aria-selected="'+(x.id===CURTAB)+'">'+t(x.k)+'</button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tabrow button"),function(b){
    b.addEventListener("click",function(){ showTab(b.getAttribute("data-tab"), true); });
  });
}
function showTab(id, scroll){
  if(!TABS.some(function(x){return x.id===id;})) id=TABS[0].id;
  CURTAB=id;
  TABS.forEach(function(x){
    var el=document.getElementById(x.id); if(el) el.hidden = (x.id!==id);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabrow button"),function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-tab")===id);
  });
  if(location.hash.slice(1)!==id){
    try{ history.replaceState(null,"","#"+id); }catch(e){ location.hash=id; }
  }
  // Leaflet measures zero in a hidden container, so re-measure once visible
  if(id==="where" && MAP){ setTimeout(function(){ MAP.invalidateSize(); },30); }
  if(id==="cities") setTimeout(syncHint,30);
  if(scroll){
    var bar=document.querySelector(".tabbar");
    var y=document.getElementById("panels").offsetTop-(bar?bar.offsetHeight:0)-4;
    scrollTo({top:Math.max(0,y),behavior:"smooth"});
  }
}
addEventListener("hashchange",function(){ showTab(location.hash.slice(1), true); });
// in-page links (e.g. "4 clear ↓" in the table) should switch tab, not just jump
document.addEventListener("click",function(e){
  var a=e.target.closest && e.target.closest('a[href^="#"]');
  if(!a) return;
  var id=a.getAttribute("href").slice(1);
  if(TABS.some(function(x){return x.id===id;})){ e.preventDefault(); showTab(id,true); }
});

/* ---------- apply language ---------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = t("title");
  var md=document.getElementById("metadesc"); if(md) md.setAttribute("content", t("metadesc"));
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(el){
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });
  document.getElementById("dsearch").setAttribute("placeholder", t("searchPh"));
  document.getElementById("lang-en").setAttribute("aria-pressed", LANG==="en");
  document.getElementById("lang-it").setAttribute("aria-pressed", LANG==="it");
  buildTabs();
  drawWhy(); buildSeeControls(); drawSee(); animSetup(); animWire();
  document.getElementById("animbtn").textContent=t("animPlay");
  drawDirectory(); drawTable();
  drawTimeline(); drawMap(); syncHint();
}
function syncHint(){
  var box=document.querySelector("#ctbl").closest(".scroll");
  var h=document.querySelector(".hint");
  if(box&&h) h.classList.toggle("show", box.scrollWidth > box.clientWidth + 1);
}
addEventListener("resize", syncHint);
function setLang(l){
  LANG=l;
  try{ localStorage.setItem("ecl-lang", l); }catch(e){}
  applyLang();
}
document.getElementById("lang-en").addEventListener("click",function(){setLang("en");});
document.getElementById("lang-it").addEventListener("click",function(){setLang("it");});

/* ---------- wiring ---------- */
(function(){
  function tog(id,key){ var el=document.getElementById(id);
    el.addEventListener("click",function(){ DFILT[key]=!DFILT[key];
      el.classList.toggle("on",DFILT[key]); drawDirectory(); }); }
  tog("f-clear","clear"); tog("f-rail","rail");
  var tm; document.getElementById("dsearch").addEventListener("input",function(){
    var v=this.value; clearTimeout(tm); tm=setTimeout(function(){DFILT.q=v;drawDirectory();},160); });
  Array.prototype.forEach.call(document.querySelectorAll("#ctbl th[data-k]"),function(th){
    th.addEventListener("click",function(){
      var k=th.getAttribute("data-k");
      if(k===sortK) asc=!asc; else { sortK=k; asc=(k==="n"||k==="reg"); }
      drawTable(); }); });
  if(!window.L){ document.getElementById("map").style.display="none";
                 document.getElementById("map-fallback").style.display="block"; }
  applyLang();
  showTab(location.hash.slice(1) || TABS[0].id, false);
})();

/* ---------- countdown ---------- */
(function(){
  var target=Date.UTC(2026,7,12,18,20,43);
  function tick(){ var d=Math.max(0,target-Date.now()),s=Math.floor(d/1000);
    document.getElementById("cd-d").textContent=Math.floor(s/86400);
    document.getElementById("cd-h").textContent=Math.floor(s%86400/3600);
    document.getElementById("cd-m").textContent=Math.floor(s%3600/60);
    document.getElementById("cd-s").textContent=s%60; }
  tick(); setInterval(tick,1000);
})();

/* ---------- starfield ---------- */
(function(){
  var c=document.getElementById("stars"),x=c.getContext("2d"),st=[];
  function size(){ c.width=c.offsetWidth*devicePixelRatio; c.height=c.offsetHeight*devicePixelRatio;
    st=[]; var n=Math.round(c.width*c.height/22000);
    for(var i=0;i<n;i++) st.push({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.3*devicePixelRatio+.3,a:Math.random(),s:Math.random()*.018+.004}); }
  function draw(){ x.clearRect(0,0,c.width,c.height);
    st.forEach(function(p){ p.a+=p.s; var o=.28+.42*Math.sin(p.a);
      x.globalAlpha=o<0?0:o; x.fillStyle="#dfe7ff";
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    requestAnimationFrame(draw); }
  size(); draw(); addEventListener("resize",size);
})();
</script>
